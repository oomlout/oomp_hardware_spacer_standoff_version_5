default_family: spacer
families:
  spacer:
    label: M3 round spacer / white nylon / 7 mm OD
    description: Add another depth to this catalogue family.
    defaults:
      type_name: spacer
      nominal_size: m3
    fields:
    - name: depth_mm
      label: Body depth (mm)
      input_type: number
      required: true
      default: 10
      help_text: Positive body depth. Saved to working_manual.yaml; regenerate to
        create the part.
